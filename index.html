<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 AI 시네마 명대사 추천 & 아카이브</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      font-family: 'Apple SD Gothic Neo', Arial, sans-serif;
      color: #f1f5f9;
    }

    .container {
      width: min(950px, 94%);
      margin: 40px auto;
      background: #1e293b;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 32px;
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .auth-box {
      max-width: 420px;
      margin: 40px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #0f172a;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    .app-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
    }

    .recommend-section {
      background: #0f172a;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .result-card {
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
      display: none;
    }

    .movie-title {
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .movie-reason {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .quote-box {
      background: #0f172a;
      border-left: 4px solid #f43f5e;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-style: italic;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      background: #334155;
      padding: 10px;
      border-radius: 12px;
    }

    select {
      flex: 1;
      height: 38px;
      padding: 0 8px;
      border: none;
      border-radius: 8px;
      background: #1e293b;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .archive-section {
      background: #0f172a;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      margin-top: 14px;
    }

    .item {
      background: #1e293b;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #334155;
      position: relative;
    }

    .item-title {
      font-weight: bold;
      color: #38bdf8;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .item-content {
      margin: 0 0 8px 0;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
    }

    .item-quote {
      font-size: 13.5px;
      color: #f43f5e;
      font-style: italic;
      background: #0f172a;
      padding: 8px;
      border-radius: 6px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      padding: 14px;
      border-radius: 16px;
      background: #0f172a;
      border: 1px solid #334155;
    }

    input {
      height: 46px;
      padding: 0 14px;
      border: 1px solid #334155;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #1e293b;
      color: white;
      width: 100%;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .primary-btn {
      background: #38bdf8;
      color: #0f172a;
      width: 100%;
      font-size: 16px;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      padding: 6px 12px;
      height: auto;
      font-size: 12px;
      position: absolute;
      right: 16px;
      top: 16px;
      border-radius: 6px;
    }

    .auth-btn {
      background: #6366f1;
      color: white;
    }

    .logout-btn {
      background: #475569;
      color: white;
      height: 38px;
    }

    .status {
      min-height: 20px;
      color: #94a3b8;
      font-size: 13px;
      font-style: italic;
      text-align: center;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #64748b;
      background: #1e293b;
      border-radius: 16px;
      border: 1px dashed #334155;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 750px) {
      .app-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 AI 시네마 명대사 추천기</h1>
    <div class="subtitle">나의 감정과 상황을 입력하면, ChatGPT가 어울리는 영화와 성우 연기를 선물합니다.</div>

    <section id="authSection">
      <div class="auth-box">
        <h3 style="margin-top:0; text-align:center; color:#38bdf8;">시네마 인공지능 로그인</h3>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="auth-btn" id="loginBtn">로그인</button>
        <button class="auth-btn" id="signupBtn" style="background:#475569;">회원가입</button>
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div>🍿 반갑습니다, <strong id="userEmail" style="color:#38bdf8;"></strong>님</div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="app-grid">
        <div class="recommend-section">
          <div class="input-group">
            <label style="color:#94a3b8; font-size:14px;">현재 내 기분이나 보고 싶은 테마를 자유롭게 적어주세요</label>
            <input id="userInput" type="text" placeholder="예) 가슴이 웅장해지는 SF 영화, 잔잔하게 위로받고 싶은 밤" />
            <button class="primary-btn" id="suggestBtn">✨ 맞춤 영화 및 AI 성우 연기 가져오기</button>
          </div>

          <div id="resultCard" class="result-card">
            <div class="movie-title" id="resTitle">영화 제목</div>
            <div class="movie-reason" id="resReason">추천 이유</div>
            <div class="quote-box" id="resScript">"명대사 구역"</div>
            
            <div class="audio-controls">
              <select id="voiceSelect">
                <option value="echo">성우: Echo (차분하고 감성적인 톤)</option>
                <option value="onyx">성우: Onyx (낮고 중후한 액션 톤)</option>
                <option value="nova">성우: Nova (밝고 활기찬 여성 톤)</option>
                <option value="alloy">성우: Alloy (정석적이고 안정적인 톤)</option>
              </select>
              <audio id="audioPlayer" controls style="height:38px; width:100%; max-width:240px;"></audio>
            </div>
          </div>
        </div>

        <div class="archive-section">
          <h3 style="margin-top:0; color:#38bdf8; display:flex; justify-content:space-between; align-items:center;">
            <span>🏛️ 나의 시네마 아카이브</span>
          </h3>
          <div style="font-size:13px; color:#94a3b8; margin-bottom: 10px;">내가 추천받았던 기록들이 실시간으로 영구 저장됩니다.</div>
          
          <div id="status" class="status"></div>
          <div id="dataList" class="list"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    // Firebase SDK 모듈 임포트
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 유저님의 파이어베이스 고유 식별 설정 정보
    const firebaseConfig = {
      apiKey: "AIzaSyCVc6dxlL8wI2q9qkJZJTFA7VFzwxqb0XY",
      authDomain: "k-flip.firebaseapp.com",
      databaseURL: "https://k-flip-default-rtdb.firebaseio.com",
      projectId: "k-flip",
      storageBucket: "k-flip.firebasestorage.app",
      messagingSenderId: "866053556740",
      appId: "1:866053556740:web:4094f6535ca3070f9a8351",
      measurementId: "G-T7DSNM2FRQ"
    };
    // 🔗 제공해주신 구글 앱스 스크립트 전용 웹앱 엔드포인트 주소
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwvi1bj3kseP3FxDnx-2rvfSVdev9y86VdTKS5_9oWMmExi4RXB1FjYRX3DVa0DkAAI_A/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // DOM 선택자 바인딩
    const authSection = document.getElementById('authSection'), mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput'), passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn'), signupBtn = document.getElementById('signupBtn'), logoutBtn = document.getElementById('logoutBtn'), userEmail = document.getElementById('userEmail');
    const userInput = document.getElementById('userInput'), suggestBtn = document.getElementById('suggestBtn'), resultCard = document.getElementById('resultCard');
    const resTitle = document.getElementById('resTitle'), resReason = document.getElementById('resReason'), resScript = document.getElementById('resScript'), voiceSelect = document.getElementById('voiceSelect'), audioPlayer = document.getElementById('audioPlayer'), dataList = document.getElementById('dataList'), statusBox = document.getElementById('status');

    let currentUser = null, currentItemsRef = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    // 🔐 Firebase Authentication (회원가입 / 로그인 핸들러)
    signupBtn.addEventListener('click', async () => {
      if(!emailInput.value || !passwordInput.value) return alert('이메일과 비밀번호를 입력해주세요.');
      try { 
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value); 
        alert('회원가입 성공! 영화 추천 페이지로 입장합니다.'); 
      } catch(e) { 
        alert('가입 실패: ' + e.message); 
      }
    });

    loginBtn.addEventListener('click', async () => {
      if(!emailInput.value || !passwordInput.value) return alert('이메일과 비밀번호를 입력해주세요.');
      try { 
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value); 
      } catch(e) { 
        alert('로그인 실패: 이메일 혹은 비밀번호를 확인하세요.'); 
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    // 유저 로그인 상태 변화 실시간 감지 리스너
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        userEmail.textContent = user.email.split('@')[0];
        startArchiveListener(user.uid); // 로그인 성공 시 개인 보관함 실시간 로드 시작
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
        stopArchiveListener();
      }
    });

    // 🏛️ Firebase Realtime Database CRUD 연동 통신부
    function startArchiveListener(uid) {
      stopArchiveListener();
      setStatus('데이터 실시간 동기화 중...');
      
      // 사용자 고유 UID 경로 하위에 데이터를 격리 저장 구조 설계
      currentItemsRef = ref(database, `users/${uid}/movies`);
      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val() || {};
        renderArchive(data);
        setStatus('데이터 아카이브 동기화 완료.');
      }, (error) => {
        console.error(error);
        setStatus('데이터 연동에 실패했습니다. 파이어베이스 규칙을 검토하세요.');
      });
    }

    function stopArchiveListener() {
      if (currentItemsRef) {
        off(currentItemsRef);
        currentItemsRef = null;
      }
    }

    // 파이어베이스로부터 받아온 데이터를 화면에 렌더링 (Read)
    function renderArchive(data) {
      dataList.innerHTML = '';
      const entries = Object.entries(data);
      
      if(entries.length === 0) { 
        dataList.innerHTML = '<div class="empty">아직 저장된 추천 영화가 없습니다. 왼쪽에 무드를 입력해 보세요!</div>'; 
        return; 
      }
      
      // 최신 추천 내역이 위로 오도록 역정렬(reverse) 배치
      entries.reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.id = `archive-${id}`;
        div.innerHTML = `
          <div class="item-title">🎬 ${escapeHTML(item.title || '')}</div>
          <p class="item-content">${escapeHTML(item.reason || '')}</p>
          <div class="item-quote">💬 "${escapeHTML(item.script || '')}"</div>
          <button class="delete-btn" onclick="deleteArchive('${id}')">삭제</button>
        `;
        dataList.appendChild(div);
      });
    }

    // 보관함 항목 실시간 삭제 요청 (Delete)
    window.deleteArchive = async function(id) {
      const isConfirmed = confirm('이 영화 추천 기록을 아카이브에서 삭제하시겠습니까?');
      if (!isConfirmed) return;

      try {
        setStatus('데이터를 보관함에서 삭제하는 중...');
        await remove(ref(database, `users/${currentUser.uid}/movies/${id}`));
      } catch (error) {
        console.error(error);
        setStatus('데이터 삭제 작업에 실패했습니다.');
      }
    };

    // 🤖 OpenAI 6중 멀티 API 키 자동 우회 하이브리드 중계 모듈
    async function requestWithRetry(payloadObj) {
      for (let i = 0; i < 6; i++) {
        try {
          payloadObj.keyIndex = i; // 몇 번째 키를 타겟팅할지 인덱스 번호 주입
          
          // 🛠️ 구글 스크립트 CORS 우회를 위해 헤더 옵션 구성 수정 완료
          const response = await fetch(APPS_SCRIPT_URL, { 
            method: 'POST', 
            headers: {
              'Content-Type': 'text/plain' // 중요: application/json 사용 시 보안 정책으로 구글이 거부합니다.
            },
            body: JSON.stringify(payloadObj) 
          });
          const resData = await response.json();
          if (resData.success) return resData; // 성공하면 즉시 우회 루프 종료 후 반환
        } catch (e) { 
          console.warn(`${i+1}번 API 엔진 혼잡으로 인한 자동 우회 스킵 발생:`, e); 
        }
      }
      throw new Error("서버 통신 실패: 구글 스크립트의 배포 설정('모든 사람'에게 액세스 허용)이 올바르게 되었는지 확인해 주세요.");
    }

    // ✨ 영화 추천 융합 코어 작동 버튼 액션
    suggestBtn.addEventListener('click', async () => {
      const inputVal = userInput.value.trim();
      if(!inputVal) return alert('원하시는 감정 상태나 영화 테마 키워드를 작성해 주세요!');

      try {
        suggestBtn.disabled = true;
        suggestBtn.textContent = '🤖 ChatGPT가 영화를 엄선하고 있습니다...';
        resultCard.style.display = 'none';

        // 1. ChatGPT 추천 엔진 데이터 요청 처리
        const recommendRes = await requestWithRetry({ type: 'recommend', userInput: inputVal });
        const movie = recommendRes.data;

        // 화면 뷰 갱신
        resTitle.textContent = movie.title;
        resReason.textContent = movie.reason;
        resScript.textContent = `"${movie.script}"`;
        resultCard.style.display = 'block';

        // 2. 파이어베이스 리얼타임 데이터베이스 자동 보관 연동 (Create)
        setStatus('추천 내역을 파이어베이스에 보관 중...');
        const movieRef = ref(database, `users/${currentUser.uid}/movies`);
        await set(push(movieRef), {
          title: movie.title,
          reason: movie.reason,
          script: movie.script,
          createdAt: new Date().toLocaleString('ko-KR')
        });

        // 3. OpenAI 성우 TTS 오디오 트랙 변환
        suggestBtn.textContent = '🔊 AI 성우가 명대사를 오디오 부스에서 녹음 중...';
        const ttsRes = await requestWithRetry({
          type: 'tts',
          text: movie.script,
          voice: voiceSelect.value
        });

        // 오디오 버퍼 스트리밍 바인딩 및 즉시 재생
        audioPlayer.src = `data:audio/mpeg;base64,${ttsRes.audioBase64}`;
        audioPlayer.play();

      } catch(err) {
        alert(err.message);
      } finally {
        suggestBtn.disabled = false;
        suggestBtn.textContent = '✨ 맞춤 영화 및 AI 성우 연기 가져오기';
      }
    });

    // 엔터 키 편의 기능 지원
    userInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !suggestBtn.disabled) {
        suggestBtn.click();
      }
    });

    // 문자열 보안 이스케이프 유틸리티 함수
    function escapeHTML(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>

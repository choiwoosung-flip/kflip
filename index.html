<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 AI 시네마 사운드 아카이브</title>
  <style>
    :root { --primary: #1e88e5; --secondary: #7e57c2; --bg: #f0f2f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #e3f2fd, #fce4ec); font-family: 'Pretendard', sans-serif; color: #333; }
    .container { width: min(1000px, 94%); margin: 40px auto; background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16); }
    h1 { text-align: center; color: var(--primary); margin-bottom: 5px; }
    .subtitle { text-align: center; color: #777; margin-bottom: 30px; font-size: 14px; }

    /* 🔐 로그인 섹션 */
    .auth-box { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    input { height: 48px; padding: 0 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.1); }
    button { border: none; border-radius: 12px; height: 48px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; }
    button:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn-login { background: var(--primary); color: white; }
    .btn-signup { background: var(--secondary); color: white; }

    /* 🕹️ 메인 레이아웃 (2단 구성) */
    .main-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 25px; margin-top: 20px; }
    .stage-card { background: #f8fafc; border-radius: 20px; padding: 25px; border: 1px solid #e2e8f0; }
    .collection-card { background: #ffffff; border-radius: 20px; padding: 25px; border: 1px solid #e2e8f0; }

    /* 🔊 사운드 구역 */
    .audio-box { background: white; border: 2px dashed var(--primary); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .speaker-icon { font-size: 50px; display: inline-block; }
    .playing { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    /* 📜 컬렉션 리스트 */
    .list-item { background: #f1f5f9; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 13px; border-left: 4px solid var(--secondary); }
    .list-item strong { color: var(--secondary); }
    .scroll-area { max-height: 400px; overflow-y: auto; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f1f5f9; padding: 10px 20px; border-radius: 15px; }
    .hidden { display: none; }
    .btn-action { width: 100%; margin-bottom: 15px; background: #10b981; color: white; height: 55px; font-size: 17px; }
    .btn-submit { background: var(--primary); color: white; width: 80px; }
    .btn-logout { background: #455a64; color: white; height: 35px; font-size: 12px; padding: 0 15px; }
    
    .report { display: none; margin-top: 15px; padding: 15px; background: white; border-radius: 12px; border: 1px solid #ddd; text-align: center; }

    @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">
  <h1>🎙️ AI 시네마 사운드 아카이브</h1>
  <div class="subtitle">나만의 주제: AI 성우가 들려주는 영화 속 명장면 수집하기</div>

  <section id="authSection">
    <div class="auth-box">
      <h2>로그인 / 회원가입</h2>
      <input id="emailInput" type="email" placeholder="이메일 주소" />
      <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
      <button class="btn-login" id="loginBtn">로그인</button>
      <button class="btn-signup" id="signupBtn">회원가입</button>
    </div>
  </section>

  <section id="mainSection" class="hidden">
    <div class="top-bar">
      <div>🎬 <strong><span id="userEmail"></span></strong> 회원님의 아카이브</div>
      <button class="btn-logout" id="logoutBtn">로그아웃</button>
    </div>

    <div class="main-grid">
      <div class="stage-card">
        <button class="btn-action" id="startBtn">🎲 AI 무작위 퀴즈 출제</button>
        <div class="audio-box">
          <div class="speaker-icon" id="speakerIcon">🤫</div>
          <p id="promptText" style="font-size: 14px; color: #666;">버튼을 누르면 AI가 문제를 생성합니다.</p>
          <div style="margin-top: 10px;">
            <select id="voiceSelect" style="width: 100%; height: 35px; margin-bottom: 10px; border-radius: 8px;">
              <option value="echo">목소리: Echo (감성적)</option>
              <option value="onyx">목소리: Onyx (중후한)</option>
              <option value="nova">목소리: Nova (발랄한)</option>
            </select>
            <audio id="audioPlayer" controls style="width: 100%;"></audio>
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
          <input id="userInput" type="text" placeholder="정답을 입력하세요" style="flex:1" disabled />
          <button class="btn-submit" id="submitBtn" disabled>제출</button>
        </div>
        <div id="gameReport" class="report"></div>
      </div>

      <div class="collection-card">
        <h3 style="margin-top: 0; color: var(--secondary);">📚 내가 수집한 명대사</h3>
        <p style="font-size: 12px; color: #888;">정답을 맞히면 자동으로 이곳에 저장됩니다.</p>
        <div id="dataList" class="scroll-area">
          <div class="empty">수집된 명대사가 없습니다.</div>
        </div>
      </div>
    </div>
  </section>
</div>

<script type="module">
  // 파이어베이스 모듈 로드
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getDatabase, ref, push, set, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  // 1. Firebase 설정 (본인 정보)
  const firebaseConfig = {
    apiKey: "AIzaSyCVc6dxlL8wI2q9qkJZJTFA7VFzwxqb0XY",
    authDomain: "k-flip.firebaseapp.com",
    databaseURL: "https://k-flip-default-rtdb.firebaseio.com",
    projectId: "k-flip",
    storageBucket: "k-flip.firebasestorage.app",
    messagingSenderId: "866053556740",
    appId: "1:866053556740:web:7718ed6285994f969a8351"
  };

  // 2. Google Apps Script URL (AI & TTS API 연동)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOYv2GwcTvZZoahyXv5Hu8vqjCdGreulkiVv13dVrJBVGJEM1dFiJgdjkQHpCYsrIo/exec';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);

  let currentUser = null;
  let currentQuiz = null;

  // --- [인증 기능: Authentication] ---
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  signupBtn.addEventListener('click', async () => {
    const email = document.getElementById('emailInput').value;
    const pw = document.getElementById('passwordInput').value;
    try { await createUserWithEmailAndPassword(auth, email, pw); alert('가입 성공!'); } catch(e) { alert(e.message); }
  });

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('emailInput').value;
    const pw = document.getElementById('passwordInput').value;
    try { await signInWithEmailAndPassword(auth, email, pw); } catch(e) { alert('로그인 실패'); }
  });

  logoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');
      document.getElementById('userEmail').textContent = user.email;
      loadCollection(user.uid); // 데이터 불러오기
    } else {
      currentUser = null;
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('mainSection').classList.add('hidden');
    }
  });

  // --- [데이터 연동: Realtime Database] ---
  function loadCollection(uid) {
    const dataRef = ref(database, `users/${uid}/collection`);
    onValue(dataRef, (snapshot) => {
      const data = snapshot.val();
      const listArea = document.getElementById('dataList');
      listArea.innerHTML = "";
      if (!data) { listArea.innerHTML = "퀴즈를 풀어 명대사를 수집하세요!"; return; }
      Object.values(data).reverse().forEach(item => {
        const div = document.createElement('div');
        div.className = "list-item";
        div.innerHTML = `<strong>🎬 ${item.title}</strong><br>"${item.script}"`;
        listArea.appendChild(div);
      });
    });
  }

  async function saveToFirebase(quiz) {
    if (!currentUser) return;
    const dataRef = ref(database, `users/${currentUser.uid}/collection`);
    const newItemRef = push(dataRef);
    await set(newItemRef, quiz);
  }

  // --- [생성형 AI & TTS 연동] ---
  const startBtn = document.getElementById('startBtn');
  const audioPlayer = document.getElementById('audioPlayer');

  startBtn.addEventListener('click', async () => {
    try {
      setLoading(true);
      document.getElementById('gameReport').style.display = 'none';
      document.getElementById('speakerIcon').classList.add('playing');
      document.getElementById('promptText').textContent = "AI가 문제를 생성하고 성우가 연습 중입니다...";

      // AI API 호출 (문제 생성)
      const chatRes = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ type: 'chat' }) });
      const chatData = await chatRes.json();
      currentQuiz = chatData.quiz;

      // TTS API 호출 (음성 변환)
      const ttsRes = await fetch(APPS_SCRIPT_URL, { 
        method: 'POST', 
        body: JSON.stringify({ type: 'tts', text: currentQuiz.script, voice: document.getElementById('voiceSelect').value }) 
      });
      const ttsData = await ttsRes.json();

      // 오디오 재생
      audioPlayer.src = `data:audio/mpeg;base64,${ttsData.audioBase64}`;
      audioPlayer.play();
      document.getElementById('promptText').textContent = "연기 송출 중! 어떤 영화일까요?";
      document.getElementById('userInput').disabled = false;
      document.getElementById('submitBtn').disabled = false;
    } catch (e) {
      alert("연결 장애가 발생했습니다.");
    } finally { setLoading(false); document.getElementById('speakerIcon').classList.remove('playing'); }
  });

  // 정답 확인 및 데이터 저장
  document.getElementById('submitBtn').addEventListener('click', () => {
    const userAns = document.getElementById('userInput').value.trim().replace(/\s+/g, '').toLowerCase();
    const targetAns = currentQuiz.title.replace(/\s+/g, '').toLowerCase();
    const report = document.getElementById('gameReport');
    report.style.display = 'block';

    if (userAns === targetAns || targetAns.includes(userAns)) {
      report.innerHTML = `<h3 style="color:green">⭕ 정답입니다!</h3><p>[${currentQuiz.title}]<br>명대사가 컬렉션에 저장되었습니다.</p>`;
      saveToFirebase(currentQuiz); // 정답일 때 데이터베이스에 저장 (데이터 연동)
    } else {
      report.innerHTML = `<h3 style="color:red">❌ 아쉽네요!</h3><p>정답: ${currentQuiz.title}</p>`;
    }
    document.getElementById('userInput').disabled = true;
    document.getElementById('submitBtn').disabled = true;
  });

  function setLoading(l) {
    startBtn.disabled = l;
    startBtn.textContent = l ? "🔄 준비 중..." : "🎲 AI 무작위 퀴즈 출제";
  }
</script>

</body>
</html>

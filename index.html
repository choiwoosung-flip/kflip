<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎙️ AI 시네마 자동 출제 퀴즈</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif; color: #333;
    }
    .container {
      width: min(600px, 94%); margin: 50px auto;
      background: #ffffff; border-radius: 24px; padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 26px; color: #1e88e5; }
    .subtitle { text-align: center; color: #777; margin-bottom: 28px; font-size: 14px; }
    
    /* 🔐 로그인 섹션 */
    .auth-box { display: flex; flex-direction: column; gap: 12px; max-width: 100%; }
    .notice {
      margin-top: 20px; padding: 14px; border-radius: 14px;
      background: #fff8e1; color: #6d4c41; font-size: 14px; line-height: 1.6; text-align: center;
    }

    /* 🕹️ 게임 섹션 */
    .game-section {
      background: #f8fafc; padding: 24px; border-radius: 20px; border: 1px solid #e2e8f0;
    }
    .audio-room {
      background: #ffffff; border: 2px dashed #42a5f5; border-radius: 18px; padding: 24px; text-align: center; margin-bottom: 20px;
    }
    .speaker-icon { font-size: 58px; margin-bottom: 8px; display: inline-block; transition: 0.3s; }
    .playing { animation: pulse 1.5s infinite ease-in-out; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

    .audio-controls { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    select { height: 40px; padding: 0 12px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 14px; width: 100%; }
    audio { width: 100%; height: 40px; }

    .answer-zone { display: flex; gap: 10px; margin-top: 8px; }
    .answer-zone input { flex: 1; }

    .game-report {
      display: none; margin-top: 20px; padding: 18px; background: white; border: 1px solid #edf1f5; border-radius: 14px; text-align: center;
    }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; padding: 12px 16px; border-radius: 16px; background: #f7f9fb;
    }
    .user-info { font-size: 14px; color: #555; }

    input { height: 46px; padding: 0 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; background: white; }
    input:focus { border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15); }

    button { border: none; border-radius: 12px; padding: 0 16px; height: 46px; font-size: 14px; cursor: pointer; transition: 0.15s; font-weight: bold; }
    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }

    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; height: 36px; padding: 0 12px; font-size: 13px; }
    .quiz-btn { background: #10b981; color: white; width: 100%; height: 52px; font-size: 16px; margin-bottom: 15px; }
    .submit-btn { background: #42a5f5; color: white; }
    
    .label { font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #475569; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ AI 시네마 명대사 퀴즈</h1>
    <div class="subtitle">ChatGPT 무작위 자동 출제 + OpenAI TTS 성우 연기 시스템</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>로그인 / 회원가입</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>
      <div class="notice">
        기존 아이디로 로그인하거나, 새 이메일 입력 후 회원가입을 누르세요.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">🎬 반갑습니다, <strong id="userEmail" style="color:#1e88e5;"></strong>님!</div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="game-section">
        <button class="quiz-btn" id="startBtn">🎲 AI 무작위 문제 출제하기</button>

        <div class="audio-room">
          <div class="speaker-icon" id="speakerIcon">🤫</div>
          <div id="quizPromptText" style="font-size: 14px; color: #666; line-height: 1.5;">
            버튼을 누르면 AI가 엄선한 영화/드라마 대사를 성우가 실감나게 연기합니다!
          </div>
          
          <div class="audio-controls">
            <select id="voiceSelect">
              <option value="echo">성우 목소리: Echo (부드러운 감성파)</option>
              <option value="onyx">성우 목소리: Onyx (중후한 액션배우)</option>
              <option value="nova">성우 목소리: Nova (통통 튀는 여성조)</option>
              <option value="alloy">성우 목소리: Alloy (안정감 있는 나레이터)</option>
            </select>
            <audio id="audioPlayer" controls></audio>
          </div>
        </div>

        <div>
          <div class="label">정답 맞추기</div>
          <div class="answer-zone">
            <input id="userInput" type="text" placeholder="들려온 대사의 영화/드라마 제목은?" disabled />
            <button class="submit-btn" id="submitBtn" disabled>제출</button>
          </div>
        </div>

        <div id="gameReport" class="game-report"></div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    // 파이어베이스 설정 정보
    const firebaseConfig = {
      apiKey: "AIzaSyCVc6dxlL8wI2q9qkJZJTFA7VFzwxqb0XY",
      authDomain: "k-flip.firebaseapp.com",
      databaseURL: "https://k-flip-default-rtdb.firebaseio.com",
      projectId: "k-flip",
      storageBucket: "k-flip.firebasestorage.app",
      messagingSenderId: "866053556740",
      appId: "1:866053556740:web:7718ed6285994f969a8351"
    };

    // 🔗 제공해주신 구글 앱스 스크립트 고유 주소 바인딩 완료!
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOYv2GwcTvZZoahyXv5Hu8vqjCdGreulkiVv13dVrJBVGJEM1dFiJgdjkQHpCYsrIo/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // DOM 요소 바인딩
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');

    const startBtn = document.getElementById('startBtn');
    const userInput = document.getElementById('userInput');
    const submitBtn = document.getElementById('submitBtn');
    const speakerIcon = document.getElementById('speakerIcon');
    const quizPromptText = document.getElementById('quizPromptText');
    const audioPlayer = document.getElementById('audioPlayer');
    const gameReport = document.getElementById('gameReport');

    let currentQuiz = null;

    // 인증 도우미함수
    function getAccount() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) { alert('이메일과 비밀번호를 모두 입력해주세요.'); return null; }
      return { email, password };
    }

    signupBtn.addEventListener('click', async () => {
      const acc = getAccount(); if (!acc) return;
      try { await createUserWithEmailAndPassword(auth, acc.email, acc.password); alert('회원가입 완료!'); } 
      catch (e) { alert('회원가입 실패: ' + e.message); }
    });

    loginBtn.addEventListener('click', async () => {
      const acc = getAccount(); if (!acc) return;
      try { await signInWithEmailAndPassword(auth, acc.email, acc.password); } 
      catch (e) { alert('로그인 실패: 이메일이나 비밀번호를 확인하세요.'); }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authSection.classList.add('hidden'); mainSection.classList.remove('hidden');
        userEmail.textContent = user.email; gameReport.style.display = 'none';
      } else {
        authSection.classList.remove('hidden'); mainSection.classList.add('hidden');
      }
    });

    // 🕹️ 완전 자동화 퀴즈 엔진
    startBtn.addEventListener('click', async () => {
      gameReport.style.display = 'none';
      userInput.value = '';
      currentQuiz = null;

      try {
        setLoading(true);
        speakerIcon.textContent = '🤔';
        speakerIcon.classList.add('playing');
        quizPromptText.textContent = 'ChatGPT가 새로운 영화 문제를 고르고 대본을 쓰는 중입니다...';

        // 1. ChatGPT에게 무작위 문제 요청하기
        const chatResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'chat' })
        });
        const chatData = await chatResponse.json();
        
        if (!chatData.success) throw new Error(chatData.error);
        currentQuiz = chatData.quiz; // {title, hint, script}가 자동으로 담김

        // 2. 받은 대사로 오디오 합성(TTS) 요청하기
        quizPromptText.textContent = '🔊 성우가 마이크 앞에서 대사 낭독 연기를 시작했습니다...';
        const ttsResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'tts',
            text: currentQuiz.script,
            voice: document.getElementById('voiceSelect').value
          })
        });
        const ttsData = await ttsResponse.json();
        if (!ttsData.success) throw new Error(ttsData.error);

        // 오디오 재생
        audioPlayer.src = base64ToAudioUrl(ttsData.audioBase64, 'audio/mpeg');
        speakerIcon.textContent = '📢';
        quizPromptText.innerHTML = '<strong>🔊 성우 연기 송출 중! 들려오는 대사의 영화/드라마 제목을 맞춰보세요.</strong>';
        audioPlayer.play();

        userInput.disabled = false;
        submitBtn.disabled = false;
        userInput.focus();

      } catch (err) {
        console.error(err);
        quizPromptText.textContent = '❌ 시스템 장애가 발생했습니다. 구글 스크립트 배포 설정(모든 사람) 및 API 키 잔액을 확인해 주세요.';
        speakerIcon.textContent = '❌';
        speakerIcon.classList.remove('playing');
      } finally { setLoading(false); }
    });

    // 채점 엔진
    function checkAnswer() {
      if (!currentQuiz) return;
      const userAns = userInput.value.trim().toLowerCase().replace(/\s+/g, '');
      const targetAns = currentQuiz.title.trim().toLowerCase().replace(/\s+/g, '');

      gameReport.style.display = 'block';
      speakerIcon.classList.remove('playing');

      let innerHtml = `<p style="margin:8px 0; font-size:15px;"><strong>🎬 대사 원문:</strong> "${currentQuiz.script}"</p>`;
      innerHtml += `<p style="margin:8px 0; font-size:14px; color:#666;"><strong>💡 출제 힌트:</strong> ${currentQuiz.hint}</p>`;

      if (userAns === targetAns || targetAns.includes(userAns) && userAns.length > 1) {
        gameReport.innerHTML = `<h3 style="color:#10b981; margin:0 0 10px;">⭕ 정답입니다! 정답은 [${currentQuiz.title}]</h3>` + innerHtml;
      } else {
        gameReport.innerHTML = `<h3 style="color:#ef4444; margin:0 0 10px;">❌ 오답입니다! 정답은 [${currentQuiz.title}]</h3>` + innerHtml;
      }
      userInput.disabled = true;
      submitBtn.disabled = true;
    }

    submitBtn.addEventListener('click', checkAnswer);
    userInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !userInput.disabled) checkAnswer(); });

    function setLoading(isLoading) {
      startBtn.disabled = isLoading;
      startBtn.textContent = isLoading ? '📻 AI 감독과 성우가 준비 중...' : '🎲 AI 무작위 문제 출제하기';
    }

    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) { byteNumbers[i] = slice.charCodeAt(i); }
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
    }
  </script>
</body>
</html>

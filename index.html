<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ 자취방 AI 멀티탭 가드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #eceff1, #cfd8dc);
      font-family: 'Malgun Gothic', sans-serif; color: #333;
    }
    .container {
      width: min(1000px, 95%); margin: 40px auto;
      background: #ffffff; border-radius: 24px; padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }
    h1 { text-align: center; margin: 0 0 5px; color: #1a237e; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 15px; }
    
    /* 대시보드 레이아웃 */
    .dashboard {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px;
    }
    .panel {
      background: #f8f9fa; border-radius: 20px; padding: 20px; border: 1px solid #e0e0e0;
    }
    .panel-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #283593; }

    /* 멀티탭 스타일 */
    .multitap {
      display: flex; flex-direction: column; gap: 12px;
    }
    .socket {
      display: flex; justify-content: space-between; align-items: center;
      background: #ffffff; padding: 16px; border-radius: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.03); border-left: 5px solid #b0bec5;
    }
    .socket.active { border-left-color: #ff7043; background: #fff5f2; }
    .device-info { display: flex; flex-direction: column; gap: 4px; }
    .device-name { font-weight: bold; font-size: 16px; }
    .device-meta { font-size: 13px; color: #666; }
    
    /* 토글 스위치 */
    .switch {
      position: relative; display: inline-block; width: 60px; height: 34px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #ff7043; }
    input:checked + .slider:before { transform: translateX(26px); }

    /* 진단 영역 스타일 */
    .btn-diagnose {
      width: 100%; height: 50px; background: #283593; color: white;
      border: none; border-radius: 12px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: 0.2s; margin-bottom: 15px;
    }
    .btn-diagnose:hover { background: #1a237e; }
    .btn-diagnose:disabled { background: #9fa8da; cursor: not-allowed; }
    
    .ai-response {
      background: white; padding: 15px; border-radius: 12px;
      min-height: 100px; border: 1px dashed #9fa8da; font-size: 15px; line-height: 1.6;
    }
    .status { margin-top: 10px; font-size: 13px; color: #e65100; font-weight: bold; }
    
    /* TTS 설정 */
    .tts-options {
      margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    select { height: 36px; border-radius: 8px; padding: 0 8px; border: 1px solid #ccc; }

    @media (max-width: 800px) {
      .dashboard { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚡ Multi-Guard</h1>
    <div class="subtitle">자취방 실시간 전력 상태 모니터링 및 AI 가드</div>

    <div class="dashboard">
      <div class="panel">
        <div class="panel-title">🔌 우리집 멀티탭 소켓 상태</div>
        <div class="multitap" id="multitapBox">
          </div>
      </div>

      <div class="panel">
        <div class="panel-title">🤖 AI 스마트 전력 안전 요원</div>
        <button class="btn-diagnose" id="diagnoseBtn">AI 실시간 전력 진단하기</button>
        
        <div class="ai-response" id="aiResponseBox">
          진단 버튼을 누르면 AI 관리자가 가전제품 상태를 분석하여 전력 효율과 화재 위험을 진단해 줍니다.
        </div>
        <div class="status" id="statusText"></div>

        <div class="tts-options">
          <select id="voiceSelect">
            <option value="alloy">목소리: Alloy (기본)</option>
            <option value="echo">목소리: Echo (부드러운)</option>
            <option value="nova">목소리: Nova (여성 톤)</option>
            <option value="onyx">목소리: Onyx (남성 톤)</option>
          </select>
          <audio id="audioPlayer" controls style="width: 100%; height: 36px;"></audio>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ [중요] 본인의 배포된 Google Apps Script Web App URL을 여기에 넣어야 작동합니다!
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzvCeCidpIBm3Ez_AbmzTRrvzCkPa_7x-irAazDPzljPmuqjjHZOqXxfyS1vNh7tX1/exec';

    // 가전제품 가상 데이터 리스트 (추후 Firebase Firestore와 연동될 데이터 구조)
    const appliances = [
      { id: 'device1', name: '🛌 전기장판', power: 150, time: 6, checked: true },
      { id: 'device2', name: '🖥️ 게이밍 컴퓨터', power: 350, time: 2, checked: true },
      { id: 'device3', name: '📱 스마트폰 충전기', power: 25, time: 5, checked: false },
      { id: 'device4', name: '💨 주방 환풍기', power: 80, time: 12, checked: false }
    ];

    const multitapBox = document.getElementById('multitapBox');
    const diagnoseBtn = document.getElementById('diagnoseBtn');
    const aiResponseBox = document.getElementById('aiResponseBox');
    const statusText = document.getElementById('statusText');
    const voiceSelect = document.getElementById('voiceSelect');
    const audioPlayer = document.getElementById('audioPlayer');

    // 화면에 멀티탭 소켓 UI 그리기
    function renderMultitap() {
      multitapBox.innerHTML = '';
      appliances.forEach((app) => {
        const div = document.createElement('div');
        div.className = `socket ${app.checked ? 'active' : ''}`;
        div.innerHTML = `
          <div class="device-info">
            <div class="device-name">${app.name}</div>
            <div class="device-meta">소비전력: ${app.power}W | 가동시간: ${app.time}시간째</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="${app.id}" ${app.checked ? 'checked' : ''} onchange="toggleDevice('${app.id}')">
            <span class="slider"></span>
          </label>
        `;
        multitapBox.appendChild(div);
      });
    }

    // 스위치 클릭 시 ON/OFF 상태 변경
    window.toggleDevice = function(id) {
      const device = appliances.find(app => app.id === id);
      if (device) {
        device.checked = !device.checked;
        renderMultitap();
      }
    };

    // AI 진단 요청 및 TTS 재생
    async function startDiagnosis() {
      const activeDevices = appliances.filter(app => app.checked);
      if (activeDevices.length === 0) {
        aiResponseBox.textContent = "현재 켜져 있는 가전제품이 없습니다. 멀티탭 스위치를 켜주세요!";
        return;
      }

      // AI에게 보낼 데이터 문자열 압축
      let deviceSummary = activeDevices.map(d => `[${d.name}: ON, 소비전력 ${d.power}W, ${d.time}시간째 작동 중]`).join(', ');
      
      try {
        setLoading(true);
        statusText.textContent = "⚡ AI 분석관이 전력 상태를 진단하는 중입니다...";
        
        // 1. AI 텍스트 분석 요청
        const aiResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'analyze', question: deviceSummary })
        });
        const aiData = await aiResponse.json();
        if (aiData.error) throw new Error(aiData.error);
        
        const aiTxtResult = aiData.answer;
        aiResponseBox.textContent = aiTxtResult;

        // 2. 받은 AI 답변으로 TTS 음성 생성 요청
        statusText.textContent = "🔊 진단 결과를 음성 가이드로 변환하고 있습니다...";
        const ttsResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'tts',
            text: aiTxtResult,
            model: 'tts-1',
            voice: voiceSelect.value,
            speed: 1.0
          })
        });
        const ttsData = await ttsResponse.json();
        if (ttsData.error) throw new Error(ttsData.error);

        // 3. 음성 파일 재생
        const audioUrl = base64ToAudioUrl(ttsData.audioBase64, 'audio/mpeg');
        audioPlayer.src = audioUrl;
        audioPlayer.play();
        
        statusText.textContent = "✅ 진단 완료! 가이드 방송을 재생합니다.";
      } catch (err) {
        console.error(err);
        alert("오류 발생: " + err.message);
        statusText.textContent = "❌ 요청 실패";
      } finally {
        setLoading(false);
      }
    }

    // Base64 오디오 변환 유틸 함수
    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
          byteNumbers[i] = slice.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        byteArrays.push(byteArray);
      }
      const blob = new Blob(byteArrays, { type: mimeType });
      return URL.createObjectURL(blob);
    }

    function setLoading(isLoading) {
      diagnoseBtn.disabled = isLoading;
      diagnoseBtn.textContent = isLoading ? '진단서 작성 중...' : 'AI 실시간 전력 진단하기';
    }

    diagnoseBtn.addEventListener('click', startDiagnosis);
    renderMultitap(); // 앱 초기화 시 화면 그리기
  </script>
</body>
</html>

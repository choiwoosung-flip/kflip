<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 AI 시네마 명대사 추천 & 아카이브</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e1b4b); font-family: 'Apple SD Gothic Neo', Arial, sans-serif; color: #f1f5f9; }
    .container { width: min(1000px, 94%); margin: 40px auto; background: #1e293b; border-radius: 24px; padding: 28px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
    h1 { margin: 0 0 8px; text-align: center; font-size: 32px; color: #38bdf8; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 28px; font-size: 15px; }
    
    .auth-box { max-width: 420px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; padding: 24px; border-radius: 20px; }
    .app-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; }
    
    .recommend-section { background: #0f172a; padding: 24px; border-radius: 20px; border: 1px solid #334155; }
    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    
    .result-card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 18px; padding: 20px; margin-top: 20px; display: none; }
    .movie-title { font-size: 22px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .movie-reason { font-size: 15px; color: #cbd5e1; line-height: 1.6; margin-bottom: 16px; }
    .quote-box { background: #1e293b; border-left: 4px solid #f43f5e; padding: 12px; border-radius: 4px; margin-bottom: 16px; font-style: italic; background: #0f172a; }

    .audio-controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; background: #334155; padding: 10px; border-radius: 12px; }
    select { flex: 1; height: 38px; padding: 0 8px; border: none; border-radius: 8px; background: #1e293b; color: white; }

    .archive-section { background: #0f172a; padding: 24px; border-radius: 20px; border: 1px solid #334155; }
    .list { display: flex; flex-direction: column; gap: 12px; max-height: 500px; overflow-y: auto; margin-top: 14px; }
    .item { background: #1e293b; padding: 16px; border-radius: 14px; border: 1px solid #334155; position: relative; }
    .item-title { font-weight: bold; color: #38bdf8; font-size: 16px; margin-bottom: 4px; }
    .item-quote { font-size: 13px; color: #f43f5e; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; padding: 14px; border-radius: 16px; background: #0f172a; }
    input { height: 46px; padding: 0 14px; border: 1px solid #334155; border-radius: 12px; font-size: 15px; outline: none; background: #1e293b; color: white; }
    button { border: none; border-radius: 12px; padding: 0 16px; height: 46px; font-size: 15px; cursor: pointer; transition: 0.15s; font-weight: bold; }
    button:hover { transform: translateY(-2px); opacity: 0.9; }

    .primary-btn { background: #38bdf8; color: #0f172a; width: 100%; font-size: 16px; }
    .delete-btn { background: #ef4444; color: white; padding: 4px 10px; height: auto; font-size: 12px; position: absolute; right: 16px; top: 16px; border-radius: 6px; }
    .auth-btn { background: #6366f1; color: white; }
    .logout-btn { background: #475569; color: white; height: 38px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 AI 시네마 명대사 추천기</h1>
    <div class="subtitle">나의 감정과 상황을 입력하면, ChatGPT가 어울리는 영화와 성우 연기를 선물합니다.</div>

    <section id="authSection">
      <div class="auth-box">
        <h3 style="margin-top:0; text-align:center;">시네마 인공지능 로그인</h3>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="auth-btn" id="loginBtn">로그인</button>
        <button class="auth-btn" id="signupBtn" style="background:#475569;">회원가입</button>
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div>🍿 반갑습니다, <strong id="userEmail" style="color:#38bdf8;"></strong>님</div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="app-grid">
        <div class="recommend-section">
          <div class="input-group">
            <label style="color:#94a3b8; font-size:14px;">현재 내 기분이나 보고 싶은 테마를 입력하세요</label>
            <input id="userInput" type="text" placeholder="예) 가슴이 웅장해지는 SF 영화, 위로받고 싶을 때 보는 영화" />
            <button class="primary-btn" id="suggestBtn">✨ 맞춤 영화 및 AI 성우 연기 가져오기</button>
          </div>

          <div id="resultCard" class="result-card">
            <div class="movie-title" id="resTitle">영화 제목</div>
            <div class="movie-reason" id="resReason">추천 이유</div>
            <div class="quote-box" id="resScript">"명대사 구역"</div>
            
            <div class="audio-controls">
              <select id="voiceSelect">
                <option value="echo">성우: Echo (차분하고 감성적인 톤)</option>
                <option value="onyx">성우: Onyx (낮고 중후한 액션 톤)</option>
                <option value="nova">성우: Nova (밝고 활기찬 여성 톤)</option>
                <option value="alloy">성우: Alloy (정석적이고 안정적인 톤)</option>
              </select>
              <audio id="audioPlayer" controls style="height:38px; width:140px;"></audio>
            </div>
          </div>
        </div>

        <div class="archive-section">
          <h3 style="margin-top:0; color:#38bdf8;">🏛️ 나의 시네마 아카이브</h3>
          <div style="font-size:13px; color:#94a3b8; margin-bottom: 10px;">기록들은 실시간으로 안전하게 저장 및 동기화됩니다.</div>
          <div id="dataList" class="list"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 파이어베이스 설정 데이터 고정 바인딩
    const firebaseConfig = {
      apiKey: "AIzaSyCVc6dxlL8wI2q9qkJZJTFA7VFzwxqb0XY",
      authDomain: "k-flip.firebaseapp.com",
      databaseURL: "https://k-flip-default-rtdb.firebaseio.com",
      projectId: "k-flip",
      storageBucket: "k-flip.firebasestorage.app",
      messagingSenderId: "866053556740",
      appId: "1:866053556740:web:7718ed6285994f969a8351"
    };

    // 🔗 유저님이 새로 제공해주신 학교 Workspace 전용 배포 주소로 완벽 매핑했습니다!
    const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/daehyun.hs.kr/s/AKfycbym1aQ4zKOTYVa29HgyZzx15LRVW7YTk5uIDxXWrbg8odS4DtHvF9P1PvaYcmSz4FTOfA/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const authSection = document.getElementById('authSection'), mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput'), passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn'), signupBtn = document.getElementById('signupBtn'), logoutBtn = document.getElementById('logoutBtn'), userEmail = document.getElementById('userEmail');
    const userInput = document.getElementById('userInput'), suggestBtn = document.getElementById('suggestBtn'), resultCard = document.getElementById('resultCard');
    const resTitle = document.getElementById('resTitle'), resReason = document.getElementById('resReason'), resScript = document.getElementById('resScript'), voiceSelect = document.getElementById('voiceSelect'), audioPlayer = document.getElementById('audioPlayer'), dataList = document.getElementById('dataList');

    let currentUser = null, currentItemsRef = null;

    // Firebase 인증 기능
    signupBtn.addEventListener('click', async () => {
      if(!emailInput.value || !passwordInput.value) return alert('정보를 채워주세요.');
      try { await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value); alert('성공적으로 가입되었습니다!'); } catch(e) { alert(e.message); }
    });
    loginBtn.addEventListener('click', async () => {
      try { await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value); } catch(e) { alert('로그인 실패: 비밀번호 등을 확인하세요.'); }
    });
    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user; authSection.classList.add('hidden'); mainSection.classList.remove('hidden');
        userEmail.textContent = user.email.split('@')[0]; startArchiveListener(user.uid);
      } else {
        currentUser = null; authSection.classList.remove('hidden'); mainSection.classList.add('hidden'); if(currentItemsRef) off(currentItemsRef);
      }
    });

    // 파이어베이스 데이터베이스 실시간 연동
    function startArchiveListener(uid) {
      currentItemsRef = ref(database, `users/${uid}/movies`);
      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val() || {};
        renderArchive(data);
      });
    }

    function renderArchive(data) {
      dataList.innerHTML = '';
      const entries = Object.entries(data);
      if(entries.length === 0) { dataList.innerHTML = '<div style="color:#64748b; text-align:center; padding:20px;">비어있음 (새로운 추천을 받아보세요!)</div>'; return; }
      entries.reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="item-title">🎬 ${item.title}</div>
          <div style="font-size:13px; color:#cbd5e1; margin-bottom:4px;">${item.reason}</div>
          <div class="item-quote">💬 "${item.script}"</div>
          <button class="delete-btn" onclick="deleteArchive('${id}')">삭제</button>
        `;
        dataList.appendChild(div);
      });
    }

    window.deleteArchive = async function(id) {
      if(confirm('이 추천 내역을 삭제하시겠습니까?')) {
        await remove(ref(database, `users/${currentUser.uid}/movies/${id}`));
      }
    }

    // OpenAI 다중 키 우회 안전 통신 모듈
    async function requestWithRetry(payloadObj) {
      for (let i = 0; i < 6; i++) {
        try {
          payloadObj.keyIndex = i;
          const response = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payloadObj) });
          const resData = await response.json();
          if (resData.success) return resData;
        } catch (e) { console.warn(`${i+1}번 키 통신 혼잡, 다음 키로 백업 우회 진행 중...`); }
      }
      throw new Error("서버 응답 오류가 발생했습니다. 구글 앱스 스크립트 배포 설정(모든 사람에게 액세스 허용)을 다시 확인해 주세요.");
    }

    // 추천 및 음성합성 연동 작동부
    suggestBtn.addEventListener('click', async () => {
      const inputVal = userInput.value.trim();
      if(!inputVal) return alert('어떤 분위기의 영화를 원하는지 적어주세요!');

      try {
        suggestBtn.disabled = true;
        suggestBtn.textContent = '🤖 ChatGPT가 영화 엄선 중...';
        resultCard.style.display = 'none';

        // 1. ChatGPT 추천 수신
        const recommendRes = await requestWithRetry({ type: 'recommend', userInput: inputVal });
        const movie = recommendRes.data;

        resTitle.textContent = movie.title;
        resReason.textContent = movie.reason;
        resScript.textContent = `"${movie.script}"`;
        resultCard.style.display = 'block';

        // 2. 파이어베이스 실시간 보관함 데이터 밀어넣기
        const movieRef = ref(database, `users/${currentUser.uid}/movies`);
        await set(push(movieRef), {
          title: movie.title,
          reason: movie.reason,
          script: movie.script
        });

        // 3. AI 성우 TTS 스트리밍 변환 및 재생
        suggestBtn.textContent = '🔊 AI 성우 명대사 연기 송출 중...';
        const ttsRes = await requestWithRetry({
          type: 'tts',
          text: movie.script,
          voice: voiceSelect.value
        });

        audioPlayer.src = `data:audio/mpeg;base64,${ttsRes.audioBase64}`;
        audioPlayer.play();

      } catch(err) {
        alert(err.message);
      } finally {
        suggestBtn.disabled = false;
        suggestBtn.textContent = '✨ 맞춤 영화 및 AI 성우 연기 가져오기';
      }
    });
  </script>
</body>
</html>

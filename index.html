<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎙️ AI 시네마 사운드 퀴즈 & 아카이브</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #e3f2fd, #fce4ec); font-family: Arial, sans-serif; color: #333; }
    .container { width: min(1000px, 94%); margin: 40px auto; background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16); }
    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; color: #1e88e5; }
    .subtitle { text-align: center; color: #777; margin-bottom: 28px; font-size: 14px; }
    
    .auth-box { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .app-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; }
    .game-section { background: #f8fafc; padding: 24px; border-radius: 20px; border: 1px solid #e2e8f0; }
    .audio-room { background: #ffffff; border: 2px dashed #42a5f5; border-radius: 18px; padding: 24px; text-align: center; margin-bottom: 20px; }
    .speaker-icon { font-size: 48px; margin-bottom: 8px; display: inline-block; transition: 0.3s; }
    .playing { animation: pulse 1.5s infinite ease-in-out; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    
    .audio-controls { margin-top: 12px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    select { height: 38px; padding: 0 8px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 14px; }
    .answer-zone { display: flex; gap: 10px; margin-top: 8px; }
    .answer-zone input { flex: 1; }
    .game-report { display: none; margin-top: 20px; padding: 16px; background: white; border: 1px solid #edf1f5; border-radius: 14px; text-align: center; }
    .game-report img { max-width: 180px; border-radius: 8px; margin-top: 10px; }

    .form-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; background: #f1f5f9; padding: 16px; border-radius: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; padding: 14px; border-radius: 16px; background: #f7f9fb; }
    
    input, textarea { height: 46px; padding: 0 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; background: white; }
    textarea { height: 70px; padding: 10px 14px; resize: none; font-family: Arial, sans-serif; }
    button { border: none; border-radius: 12px; padding: 0 16px; height: 46px; font-size: 14px; cursor: pointer; transition: 0.15s; font-weight: bold; }
    button:hover { transform: translateY(-2px); opacity: 0.9; }

    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; height: 38px; }
    .add-btn { background: #42a5f5; color: white; }
    .quiz-btn { background: #10b981; color: white; width: 100%; height: 50px; font-size: 16px; }
    .refresh-btn { background: #66bb6a; color: white; width: 100%; margin-bottom: 16px; }
    .delete-btn { background: #ef5350; color: white; height: 34px; font-size: 12px; border-radius: 6px; }
    
    .status { min-height: 24px; margin-bottom: 14px; color: #666; font-size: 13px; font-style: italic; text-align: center; }
    .list { display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto; }
    .item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; background: #f8fafc; border: 1px solid #e2e8f0; }
    .label { font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #475569; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ AI 시네마 명대사 퀴즈 & 아카이브</h1>
    <div class="subtitle">Firebase 연동 + 로그인 활성화 + OpenAI ChatGPT & TTS 엔진 통합본</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>로그인 / 회원가입</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">🎬 안녕하세요, <strong id="userEmail" style="color:#1e88e5;"></strong> 회원님!</div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="app-grid">
        <div class="game-section">
          <div class="label" style="font-size:16px; color:#10b981; margin-bottom:12px;">🎮 QUIZ STAGE</div>
          <button class="quiz-btn" id="startBtn">🎲 내 문제 은행에서 AI 출제하기</button>

          <div class="audio-room">
            <div class="speaker-icon" id="speakerIcon">🤫</div>
            <div id="quizPromptText" style="font-size: 14px; color: #666;">문제를 출제하면 데이터베이스에 등록된 대사를 바탕으로 AI가 연기를 시작합니다.</div>
            
            <div class="audio-controls">
              <select id="voiceSelect">
                <option value="echo">성우 톤: Echo (부드러운 감성파)</option>
                <option value="onyx">성우 톤: Onyx (중후한 액션배우)</option>
                <option value="nova">성우 톤: Nova (통통 튀는 여성조)</option>
                <option value="alloy">성우 톤: Alloy (안정적인 목소리)</option>
              </select>
              <audio id="audioPlayer" controls style="height:38px;"></audio>
            </div>
          </div>

          <div>
            <div class="label">정답 맞추기</div>
            <div class="answer-zone">
              <input id="userInput" type="text" placeholder="들려온 대사의 작품 제목을 쓰세요!" disabled />
              <button class="add-btn" id="submitBtn" disabled>제출</button>
            </div>
          </div>
          <div id="gameReport" class="game-report"></div>
        </div>

        <div class="admin-section">
          <div class="label" style="font-size:16px; color:#1e88e5; margin-bottom:12px;">🏛️ 나만의 퀴즈 데이터베이스 (CRUD)</div>
          <div class="form-box">
            <div class="form-row">
              <input id="titleInput" type="text" placeholder="정답 작품명" />
              <input id="hintInput" type="text" placeholder="힌트" />
            </div>
            <textarea id="scriptInput" placeholder="AI 성우가 실감나게 연기할 명대사를 입력하세요."></textarea>
            <input id="urlInput" type="text" placeholder="포스터 이미지 주소(URL) - 생략 가능" />
            <button class="add-btn" id="addBtn">문제 은행에 추가</button>
          </div>

          <button class="refresh-btn" id="refreshBtn">🔄 실시간 데이터 동기화</button>
          <div id="status" class="status"></div>
          <div id="dataList" class="list"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 파이어베이스 계정 정보 바인딩
    const firebaseConfig = {
      apiKey: "AIzaSyCVc6dxlL8wI2q9qkJZJTFA7VFzwxqb0XY",
      authDomain: "k-flip.firebaseapp.com",
      databaseURL: "https://k-flip-default-rtdb.firebaseio.com",
      projectId: "k-flip",
      storageBucket: "k-flip.firebasestorage.app",
      messagingSenderId: "866053556740",
      appId: "1:866053556740:web:7718ed6285994f969a8351"
    };

    // 🔗 유저님이 방금 새로 보내주신 구글 스크립트 주소로 깔끔하게 교체했습니다!
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpFUcZFRvgDSmEAPLvySVgs_W_rEr_fe5d6B7wkPs26TI8XREUOaf0tskA2j_hP8vZ/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // DOM 선택자
    const authSection = document.getElementById('authSection'), mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput'), passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn'), signupBtn = document.getElementById('signupBtn'), logoutBtn = document.getElementById('logoutBtn'), userEmail = document.getElementById('userEmail');
    const titleInput = document.getElementById('titleInput'), hintInput = document.getElementById('hintInput'), scriptInput = document.getElementById('scriptInput'), urlInput = document.getElementById('urlInput'), addBtn = document.getElementById('addBtn'), refreshBtn = document.getElementById('refreshBtn'), dataList = document.getElementById('dataList'), statusBox = document.getElementById('status');
    const startBtn = document.getElementById('startBtn'), userInput = document.getElementById('userInput'), submitBtn = document.getElementById('submitBtn'), speakerIcon = document.getElementById('speakerIcon'), quizPromptText = document.getElementById('quizPromptText'), audioPlayer = document.getElementById('audioPlayer'), gameReport = document.getElementById('gameReport');

    let currentUser = null, currentItemsRef = null, globalQuizPool = {}, currentQuiz = null;

    function setStatus(msg) { statusBox.textContent = msg; }

    // 로그인 및 회원가입
    signupBtn.addEventListener('click', async () => {
      if(!emailInput.value || !passwordInput.value) return alert('이메일과 비밀번호를 입력하세요.');
      try { await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value); alert('회원가입 완료!'); } catch(e) { alert(e.message); }
    });

    loginBtn.addEventListener('click', async () => {
      try { await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value); } catch(e) { alert('로그인 실패: 정보를 확인하세요.'); }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user; authSection.classList.add('hidden'); mainSection.classList.remove('hidden');
        userEmail.textContent = user.email; startRealtimeListener(user.uid);
      } else {
        currentUser = null; authSection.classList.remove('hidden'); mainSection.classList.add('hidden'); stopRealtimeListener();
      }
    });

    // 리얼타임 데이터베이스 연동
    function startRealtimeListener(uid) {
      stopRealtimeListener();
      setStatus('데이터 실시간 연동 중...');
      currentItemsRef = ref(database, `users/${uid}/items`);
      onValue(currentItemsRef, (snapshot) => {
        globalQuizPool = snapshot.val() || {};
        renderData(globalQuizPool);
        setStatus('데이터 동기화 완료.');
      });
    }
    function stopRealtimeListener() { if (currentItemsRef) { off(currentItemsRef); currentItemsRef = null; } }

    // 데이터 추가 (Create)
    addBtn.addEventListener('click', async () => {
      if (!titleInput.value || !scriptInput.value) return alert('정답 작품명과 명대사는 필수입니다.');
      try {
        const itemRef = ref(database, `users/${currentUser.uid}/items`);
        await set(push(itemRef), {
          title: titleInput.value.trim(),
          hint: hintInput.value.trim() || '힌트가 없습니다.',
          script: scriptInput.value.trim(),
          imgUrl: urlInput.value.trim() || 'https://placehold.co/400x600?text=No+Poster'
        });
        titleInput.value = ''; hintInput.value = ''; scriptInput.value = ''; urlInput.value = '';
      } catch(e) { alert('데이터 저장 실패'); }
    });

    function renderData(data) {
      dataList.innerHTML = '';
      if(Object.keys(data).length === 0) { dataList.innerHTML = '<div style="text-align:center; padding:20px; color:#999;">문제를 추가해 주세요!</div>'; return; }
      Object.entries(data).reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div><strong>[${item.title}]</strong> - 💡 ${item.hint}<br><span style="font-size:13px; color:#555;">💬 "${item.script}"</span></div>
          <div><button class="delete-btn" onclick="deleteItem('${id}')">삭제</button></div>
        `;
        dataList.appendChild(div);
      });
    }

    window.deleteItem = async function(id) {
      if(confirm('이 퀴즈를 삭제하시겠습니까?')) {
        await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
      }
    };

    // 🕹️ 핵심 기능: 인덱스 순서대로 살아있는 키를 탐색 요청하는 하이브리드 통신부
    async function requestWithRetry(payloadObj) {
      // 6개의 키 중 살아있는 녀석을 찾을 때까지 프론트앤드 레벨에서 순차 인덱스 검사 요청을 보냅니다.
      for (let keyIdx = 0; keyIdx < 6; keyIdx++) {
        try {
          payloadObj.keyIndex = keyIdx; // 스크립트 측에 몇 번째 키를 쓸지 알려주는 변수 주입
          const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payloadObj)
          });
          const resData = await response.json();
          if (resData.success) {
            return resData; // 성공하면 즉시 리턴하고 종료
          }
          console.warn(`${keyIdx + 1}번째 키 실패, 다음 키로 우회 시도...`, resData.error);
        } catch (e) {
          console.error(`${keyIdx + 1}번째 키 통신 예외 발생`, e);
        }
      }
      throw new Error("모든 API 키가 만료되었거나 차단되었습니다.");
    }

    // AI 문제 출제 및 TTS 결합 엔진
    startBtn.addEventListener('click', async () => {
      const keys = Object.keys(globalQuizPool);
      if (keys.length === 0) return alert('우측 문제 은행에 먼저 문제를 1개 이상 추가한 뒤 출제해 주세요!');

      gameReport.style.display = 'none';
      userInput.value = '';
      
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      currentQuiz = globalQuizPool[randomKey];

      try {
        startBtn.disabled = true;
        startBtn.textContent = '📻 AI가 가공하는 중...';
        speakerIcon.textContent = '🤔';
        speakerIcon.classList.add('playing');
        quizPromptText.textContent = 'ChatGPT가 대사의 대본 감정선을 극적으로 분석하고 있습니다...';

        // 1. ChatGPT 연동 (우회 탐색 요청)
        const chatData = await requestWithRetry({ 
          type: 'chat', 
          question: `대사: "${currentQuiz.script}"` 
        });

        // 2. TTS 연동 (우회 탐색 요청)
        quizPromptText.textContent = '🔊 분석 완료! AI 성우가 녹음실 부스에서 명대사 연기를 시작합니다...';
        const ttsData = await requestWithRetry({
          type: 'tts',
          text: chatData.answer,
          voice: document.getElementById('voiceSelect').value
        });

        // 오디오 정상 출력 바인딩
        audioPlayer.src = `data:audio/mpeg;base64,${ttsData.audioBase64}`;
        speakerIcon.textContent = '📢';
        quizPromptText.innerHTML = '<strong>🔊 성우 연기 송출 중! 들려오는 대사의 영화/드라마 제목을 맞춰보세요.</strong>';
        audioPlayer.play();

        userInput.disabled = false;
        submitBtn.disabled = false;
        userInput.focus();

      } catch (err) {
        console.error(err);
        quizPromptText.textContent = '❌ 시스템 장애가 발생했습니다. 구글 스크립트 코드 내부의 키 리스트나 크레딧 상태를 점검하세요.';
        speakerIcon.textContent = '❌';
      } finally {
        startBtn.disabled = false;
        startBtn.textContent = '🎲 내 문제 은행에서 AI 출제하기';
        speakerIcon.classList.remove('playing');
      }
    });

    // 정답 제출 핸들러
    function checkAnswer() {
      if(!currentQuiz) return;
      const userAns = userInput.value.trim().toLowerCase().replace(/\s+/g, '');
      const targetAns = currentQuiz.title.trim().toLowerCase().replace(/\s+/g, '');
      gameReport.style.display = 'block';

      let content = `<p><strong>🎬 대사 원문:</strong> "${currentQuiz.script}"</p><p><strong>💡 힌트:</strong> ${currentQuiz.hint}</p><img src="${currentQuiz.imgUrl}" onerror="this.src='https://placehold.co/400x600?text=No+Poster'">`;

      if (userAns === targetAns || targetAns.includes(userAns) && userAns.length > 0) {
        gameReport.innerHTML = `<h3 style="color:#10b981; margin:0 0 10px;">⭕ 정답입니다!</h3>` + content;
      } else {
        gameReport.innerHTML = `<h3 style="color:#ef4444; margin:0 0 10px;">❌ 오답입니다! 정답은 [${currentQuiz.title}]</h3>` + content;
      }
      userInput.disabled = true;
      submitBtn.disabled = true;
    }

    submitBtn.addEventListener('click', checkAnswer);
    userInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !userInput.disabled) checkAnswer(); });
  </script>
</body>
</html>
